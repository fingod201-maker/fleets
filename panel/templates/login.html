{% extends "base.html" %}
{% block title %}fleet — sign in{% endblock %}
{% block body %}
<div class="login-wrap">
  <form class="card login" method="post" action="/login">
    <h1>fleet</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <label>operator<input type="text" name="username" autocomplete="username" required autofocus></label>
    <label>password<input type="password" name="password" autocomplete="current-password" required></label>
    <label>totp<input type="text" name="totp" inputmode="numeric" autocomplete="one-time-code" placeholder="if enabled"></label>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit">sign in</button>
  </form>
</div>
{% endblock %}
