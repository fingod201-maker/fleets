name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-linux:
    name: shellcheck + golangci-lint (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Go + golangci-lint
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache: false
      - run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v1.64.2
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install shellcheck
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck

      - name: shellcheck (all shell scripts + templates)
        run: |
          shellcheck \
            droppers/linux/*.sh droppers/linux/*.tmpl \
            droppers/mac/*.sh \
            deploy/*.sh deploy/start-listeners.sh \
            || { echo "shellcheck found issues above"; exit 1; }

      - name: golangci-lint (bridge)
        run: |
          cd bridge && golangci-lint run ./...

  test-linux:
    name: pytest + ruff + rd-linux build + Xvfb runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r panel/requirements.txt pytest ruff bcrypt httpx websockets

      - name: ruff
        run: python -m ruff check panel tests

      - name: pytest (full suite)
        run: python -m pytest -q

      - name: Build rd-linux
        run: |
          sudo apt-get update -y && sudo apt-get install -y gcc libx11-dev libxtst-dev libjpeg-dev
          bash rd/build.sh /tmp/rd-out
          ls -l /tmp/rd-out/rd-linux

      - name: rd-linux runtime smoke test under Xvfb (input path)
        run: |
          sudo apt-get install -y xvfb x11-utils
          python tests/test_rd_linux_runtime.py

  test-windows:
    name: build rd-win/hvnc (MinGW) + pytest + ruff
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@v1
        with:
          platform: x64

      - name: Build rd-win.exe + hvnc.exe + credprompt.exe
        shell: bash
        run: |
          bash rd/build.sh /tmp/rd-out
          ls -l /tmp/rd-out/rd-win.exe /tmp/rd-out/hvnc.exe /tmp/rd-out/credprompt.exe

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r panel/requirements.txt pytest ruff bcrypt httpx websockets

      - name: ruff
        run: python -m ruff check panel tests

      - name: pytest (full suite)
        run: python -m pytest -q

  test-macos:
    name: build rd-mac (macOS)
    needs: []
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal rd-mac
        run: |
          set -eux
          clang -O2 -arch x86_64 -arch arm64 -Wno-deprecated-declarations \
            -o rd-mac rd/mac/main.c \
            -framework ApplicationServices -framework CoreGraphics -framework Foundation
          file rd-mac
          codesign --force --sign - rd-mac || true
          shasum -a 256 rd-mac
          ls -l rd-mac
      - uses: actions/upload-artifact@v4
        with:
          name: rd-mac
          path: rd-mac
          retention-days: 30
